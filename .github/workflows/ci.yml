name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Prefer a recent stable Xcode on the runner image.
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Show schemes
        run: xcodebuild -list -project Blink.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

  linescroll-ios:
    name: LineScroll (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Show LineScroll schemes
        run: xcodebuild -list -project LineScroll/LineScroll.xcodeproj

      - name: Build LineScroll
        run: |
          set -o pipefail
          DEST=$(xcodebuild -project LineScroll/LineScroll.xcodeproj -scheme LineScroll -showdestinations 2>/dev/null | sed -n 's/.*platform:iOS Simulator,.*id:\([^,]*\).*/id=\1/p' | head -1)
          if [ -z "$DEST" ]; then
            DEST='platform=iOS Simulator,name=iPhone 16'
          else
            DEST="platform=iOS Simulator,$DEST"
          fi
          echo "Using destination: $DEST"
          xcodebuild \
            -project LineScroll/LineScroll.xcodeproj \
            -scheme LineScroll \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath "$RUNNER_TEMP/LineScrollDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
